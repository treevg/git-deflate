name: 🏷️ Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer Version Bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (preview release without committing, tagging, or pushing)'
        required: false
        default: false
        type: boolean

jobs:
  release:
    uses: treevg/github-workflows/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
