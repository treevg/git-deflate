name: 🏷️ Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer Version Bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Create Release & Tag
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔢 Bump Version & Update Changelog
        id: version_bump
        run: |
          python3 tools/release_version.py ${{ github.event.inputs.bump }}

      - name: 🧪 Run Automated Tests
        run: |
          ./tests/run_tests.sh

      - name: 🏷️ Commit, Tag & Push to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          VERSION="${{ steps.version_bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "Error: Version not set by version_bump step." >&2
            exit 1
          fi
          
          echo "Releasing version: v$VERSION"
          
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main --follow-tags

          # Create GitHub Release
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes
